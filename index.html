<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FAF7F0">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Kleidungs-Kiosk</title>
  <style>
    :root {
      --bg: #FAF7F0;
      --ink: #3B3632;
      --ink-soft: rgba(59, 54, 50, 0.35);
    }

    /* [hidden] muss auch Elemente mit einem eigenen display: … übersteuern */
    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background: var(--bg);
      color: var(--ink);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== Raster, feste Maße in px = iOS-pt (§11.1) ===== */
    #app {
      position: relative;
      width: 375px;
      height: 667px;
      flex: none;
      background: var(--bg);
      overflow: hidden;
    }

    .screen { position: absolute; inset: 0; }

    #wx-icon, #sys-icon, .hint-icon { color: var(--ink); }
    #wx-icon, .loading-dot { position: absolute; left: 16px; top: 32px; width: 48px; height: 48px; }
    .loading-dot {
      border-radius: 50%;
      background: var(--ink-soft);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .3; }
      50% { opacity: 1; }
    }

    #temp {
      position: absolute; left: 76px; top: 20px; width: 150px; height: 72px;
      display: flex; align-items: center;
      font-family: ui-rounded, -apple-system, system-ui, sans-serif;
      font-size: 40px; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    #hint1 { position: absolute; left: 235px; top: 38px; width: 36px; height: 36px; }
    #hint2 { position: absolute; left: 279px; top: 38px; width: 36px; height: 36px; }
    #sys-icon { position: absolute; left: 323px; top: 38px; width: 36px; height: 36px; }

    .acc-icon { position: absolute; left: 20px; width: 48px; height: 48px; shape-rendering: crispEdges; }
    .acc-icon[data-slot="0"] { top: 104px; }
    .acc-icon[data-slot="1"] { top: 160px; }
    .acc-icon[data-slot="2"] { top: 216px; }

    .cloth-icon { position: absolute; left: 131.5px; width: 128px; height: 128px; shape-rendering: crispEdges; }
    .cloth-icon[data-slot="0"] { top: 104px; }
    .cloth-icon[data-slot="1"] { top: 240px; }
    .cloth-icon[data-slot="2"] { top: 376px; }
    .cloth-icon[data-slot="3"] { top: 512px; }

    #scale { position: absolute; left: 327px; top: 100px; width: 24px; height: 544px; }
    #scale-dot {
      position: absolute; left: 331px; width: 16px; height: 16px;
      border-radius: 50%; background: var(--ink);
    }

    #screen-setup {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 0 32px; text-align: center; font-family: -apple-system, system-ui, sans-serif;
    }
    #screen-setup button {
      font: inherit; font-size: 17px; padding: 12px 24px; border-radius: 12px;
      border: 2px solid var(--ink); background: transparent; color: var(--ink);
    }
    #screen-setup code { display: block; word-break: break-all; color: var(--ink-soft); }

    #debug-overlay {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px;
      background: rgba(250, 247, 240, 0.85); color: var(--ink);
      font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap;
    }

    #test-output {
      position: absolute; inset: 0; overflow-y: auto; touch-action: pan-y;
      background: var(--bg); color: var(--ink); padding: 16px;
      font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap;
    }
  </style>
</head>

        depthMin: 2,                  // cm liegender Schnee
        top: 'schneeanzug',           // in allen Bändern
        shoes: 'winterstiefel',       // in allen Bändern, schlägt Gummistiefel, auch über 0 °C
      },
      ice: {                          // Glätte-Hinweis                                             A-07
        tempMax: 1,                   // °C: tempMin ≤ tempMax …
        wetMin: 0.1,                  // … UND (rainSum ≥ wetMin ODER wetBefore ≥ wetMin)
        freezingCodes: [56, 57, 66, 67],   // gefrierender Niesel/Regen im Fenster: immer Glätte
      },
      maxAccessories: 3,
      accessoryOrder: ['sonnencreme', 'handschuhe', 'schal', 'sonnenbrille'],   // A-08
      maxHints: 2,
    };

    // Rang entspricht der Reihenfolge, höher heißt schwerer (§8.1). Unbekannte
    // Codes fallen auf den Eintrag ohne eigene codes-Liste zurück ("bedeckt").
    const WX = {
      codeGroups: [
        { icon: 'klar',      iconNight: 'klar-nacht', codes: [0, 1] },
        { icon: 'teilweise', iconNight: 'bedeckt',     codes: [2] },
        { icon: 'bedeckt',   iconNight: 'bedeckt',     codes: [3] },
        { icon: 'nebel',     iconNight: 'nebel',       codes: [45, 48] },
        { icon: 'niesel',    iconNight: 'niesel',      codes: [51, 53, 55, 56, 57] },
        { icon: 'regen',     iconNight: 'regen',       codes: [61, 63, 65, 66, 67, 80, 81, 82] },
        { icon: 'schnee',    iconNight: 'schnee',      codes: [71, 73, 75, 77, 85, 86] },
        { icon: 'gewitter',  iconNight: 'gewitter',    codes: [95, 96, 99] },
      ],
      unknownRank: 2, // "bedeckt"
    };

    function wxRank(code) {
      const i = WX.codeGroups.findIndex((g) => g.codes.includes(code));
      return i === -1 ? WX.unknownRank : i;
    }

    function wxIconId(code, isDay) {
      const i = WX.codeGroups.findIndex((g) => g.codes.includes(code));
      const group = WX.codeGroups[i === -1 ? WX.unknownRank : i];
      return `i-wx-${isDay ? group.icon : group.iconNight}`;
    }

    // ===== Aggregation: Wetterfenster (§6) =====
    function findWindowIndex(hourly, nowS) {
      const time = hourly.time;
      for (let i = 0; i < time.length; i++) {
        if (time[i] <= nowS && nowS < time[i] + 3600) return i;
      }
      return -1;
    }

    function validValues(arr, i0, i1) {
      const out = [];
      for (let i = Math.max(0, i0); i <= i1 && i < arr.length; i++) {
        const v = arr[i];
        if (v !== null && v !== undefined) out.push(v);
      }
      return out;
    }

    function minOrNull(arr, i0, i1) {
      const v = validValues(arr, i0, i1);
      return v.length ? Math.min(...v) : null;
    }

    function maxOrZero(arr, i0, i1) {
      const v = validValues(arr, i0, i1);
      return v.length ? Math.max(...v) : 0;
    }

    function sumOrZero(arr, i0, i1) {
      const v = validValues(arr, i0, i1);
      return v.reduce((a, b) => a + b, 0);
    }

    function aggregate(forecast, nowMs) {
      const hourly = forecast && forecast.hourly;
      if (!hourly || !hourly.time) return null;

      const nowS = Math.floor(nowMs / 1000);
      const i = findWindowIndex(hourly, nowS);
      if (i === -1 || i + 4 >= hourly.time.length) return null;

      let tempDisplay = null;
      if (forecast.current && forecast.current.temperature_2m !== null && forecast.current.temperature_2m !== undefined
          && (nowS - forecast.current.time) < 3600) {
        tempDisplay = forecast.current.temperature_2m;
      } else {
        const v = hourly.temperature_2m[i];
        tempDisplay = (v === null || v === undefined) ? null : v;
      }

      const codeValues = validValues(hourly.weather_code, i, i + 3);
      let code = 0;
      if (codeValues.length) {
        code = codeValues.reduce((worst, c) => (wxRank(c) > wxRank(worst) ? c : worst), codeValues[0]);
      }

      return {
        tempDisplay,
        feltMin: minOrNull(hourly.apparent_temperature, i, i + 3),
        tempMin: minOrNull(hourly.temperature_2m, i, i + 3),
        rainProbMax: maxOrZero(hourly.precipitation_probability, i + 1, i + 4),
        rainSum: sumOrZero(hourly.precipitation, i + 1, i + 4),
        wetBefore: sumOrZero(hourly.precipitation, i - 5, i),
        snowSum: sumOrZero(hourly.snowfall, i + 1, i + 4),
        snowDepth: maxOrZero(hourly.snow_depth, i, i + 3) * 100,
        uvMax: maxOrZero(hourly.uv_index, i, i + 3),
        gustMax: maxOrZero(hourly.wind_gusts_10m, i + 1, i + 4),
        code,
        isDay: hourly.is_day[i] === 1,
      };
    }

    // ===== Entscheidungslogik (§7) =====
    function recommend(conditions, rules, wx) {
      const c = conditions;
      const overrides = [];

      const band = rules.bands.find((b) => c.feltMin >= b.min);

      let head = band.head;
      let top = band.top;
      let bottom = band.bottom;
      let shoes = band.shoes;
      let accessories = [...band.acc];

      if (c.uvMax >= rules.sun.uvMin) {
        accessories.push('sonnencreme');
        if (head === null) head = rules.sun.head;
        overrides.push('sun');
        if (c.uvMax >= rules.sun.uvGlasses) {
          accessories.push('sonnenbrille');
          overrides.push('glasses');
        }
      }

      if (c.gustMax >= rules.wind.gustMin && rules.wind.topInBands.includes(band.id)) {
        top = rules.wind.top;
        overrides.push('wind');
      }

      const rainActive = c.rainProbMax >= rules.rain.probMin && c.rainSum >= rules.rain.sumMin;
      if (rainActive) {
        let changed = false;
        if (rules.rain.topInBands.includes(band.id)) { top = rules.rain.top; changed = true; }
        if (rules.rain.shoesInBands.includes(band.id)) { shoes = rules.rain.shoes; changed = true; }
        if (changed) overrides.push('rain');
      }

      const snowActive = c.snowSum >= rules.snow.sumMin || c.snowDepth >= rules.snow.depthMin;
      if (snowActive) {
        top = rules.snow.top;
        shoes = rules.snow.shoes;
        overrides.push('snow');
      }

      const seen = new Set();
      accessories = accessories.filter((a) => (seen.has(a) ? false : (seen.add(a), true)));
      accessories.sort((a, b) => {
        const ia = rules.accessoryOrder.indexOf(a);
        const ib = rules.accessoryOrder.indexOf(b);
        return (ia === -1 ? Infinity : ia) - (ib === -1 ? Infinity : ib);
      });
      accessories = accessories.slice(0, rules.maxAccessories);

      const iceActive = rules.ice.freezingCodes.includes(c.code)
        || (c.tempMin <= rules.ice.tempMax && (c.rainSum >= rules.ice.wetMin || c.wetBefore >= rules.ice.wetMin));
      const windHintActive = c.gustMax >= rules.wind.gustMin;
      let hints = [];
      if (iceActive) hints.push('i-hint-glaette');
      if (windHintActive) hints.push('i-hint-wind');
      hints = hints.slice(0, rules.maxHints);

      const weatherIcon = wxIconId(c.code, c.isDay);

      const clamped = Math.min(rules.scale.max, Math.max(rules.scale.min, c.feltMin));
      const scalePos = (rules.scale.max - clamped) / (rules.scale.max - rules.scale.min);

      return {
        band: band.id,
        head: head ? `i-head-${head}` : null,
        top: `i-top-${top}`,
        bottom: `i-bottom-${bottom}`,
        shoes: `i-shoes-${shoes}`,
        accessories: accessories.map((a) => `i-acc-${a}`),
        weatherIcon,
        hints,
        scalePos,
        overrides,
      };
    }

    // ===== DOM =====
    const els = {
      kiosk: document.getElementById('screen-kiosk'),
      setup: document.getElementById('screen-setup'),
      btnGeo: document.getElementById('btn-geo'),
      wxIcon: document.getElementById('wx-icon'),
      loadingDot: document.getElementById('loading-dot'),
      temp: document.getElementById('temp'),
      hint1: document.getElementById('hint1'),
      hint2: document.getElementById('hint2'),
      sysIcon: document.getElementById('sys-icon'),
      accIcons: [...document.querySelectorAll('.acc-icon')],
      clothIcons: [...document.querySelectorAll('.cloth-icon')],
      scaleDividers: document.getElementById('scale-dividers'),
      scaleDot: document.getElementById('scale-dot'),
      debugOverlay: document.getElementById('debug-overlay'),
      testOutput: document.getElementById('test-output'),
    };

    function setUse(svgEl, id) {
      svgEl.querySelector('use').setAttribute('href', `#${id}`);
    }

    // el.hidden = … reflektiert bei SVG-Elementen nicht zuverlässig auf das
    // Attribut, deshalb hier direkt über das Attribut steuern.
    function setHidden(el, hide) {
      el.toggleAttribute('hidden', !!hide);
    }

    function showScreen(name) {
      setHidden(els.kiosk, name !== 'kiosk');
      setHidden(els.setup, name !== 'setup');
    }

    function setWxSlot(kind, iconId) {
      if (kind === 'loading') {
        setHidden(els.wxIcon, true);
        setHidden(els.loadingDot, false);
      } else {
        setHidden(els.loadingDot, true);
        setHidden(els.wxIcon, false);
        setUse(els.wxIcon, iconId);
      }
    }

    function hideAllClothing() { els.clothIcons.forEach((el) => { setHidden(el, true); }); }
    function hideAllAcc() { els.accIcons.forEach((el) => { setHidden(el, true); }); }
    function hideHints() { setHidden(els.hint1, true); setHidden(els.hint2, true); }

    function formatTemp(t) {
      if (t === null || t === undefined) return '';
      const r = Math.round(t);
      const sign = r < 0 ? '−' : '';
      return `${sign}${Math.abs(r)}°C`;
    }

    function buildScaleDividers() {
      const svgNS = 'http://www.w3.org/2000/svg';
      const { max, min } = RULES.scale;
      RULES.bands.forEach((band) => {
        if (band.min === -Infinity) return;
        const y = Math.round(((max - band.min) / (max - min)) * 544 * 2) / 2;
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', '1');
        line.setAttribute('x2', '23');
        line.setAttribute('y1', y);
        line.setAttribute('y2', y);
        els.scaleDividers.appendChild(line);
      });
    }

    function renderOutfit(outfit, conditions) {
      setWxSlot('icon', outfit.weatherIcon);
      els.temp.textContent = formatTemp(conditions.tempDisplay);

      const hints = [outfit.hints[0] || null, outfit.hints[1] || null];
      [els.hint1, els.hint2].forEach((el, i) => {
        if (hints[i]) { setHidden(el, false); setUse(el, hints[i]); } else { setHidden(el, true); }
      });

      const slots = [outfit.head, outfit.top, outfit.bottom, outfit.shoes];
      els.clothIcons.forEach((el, i) => {
        if (slots[i]) { setHidden(el, false); setUse(el, slots[i]); } else { setHidden(el, true); }
      });

      els.accIcons.forEach((el, i) => {
        const id = outfit.accessories[i];
        if (id) { setHidden(el, false); setUse(el, id); } else { setHidden(el, true); }
      });

      els.scaleDot.style.top = `${108 + outfit.scalePos * 528 - 8}px`;
    }

    function renderBlank() {
      els.temp.textContent = '';
      hideAllClothing();
      hideAllAcc();
      hideHints();
      els.scaleDot.style.top = '';
    }

    function renderDebugOverlay(outfit, conditions, ageMin) {
      setHidden(els.debugOverlay, false);
      els.debugOverlay.textContent = [
        `band: ${outfit.band}`,
        `feltMin: ${conditions.feltMin}`,
        `overrides: ${outfit.overrides.join(', ') || '–'}`,
        `hints: ${outfit.hints.length ? outfit.hints.join(', ') : '–'}`,
        `Datenalter: ${ageMin} min`,
      ].join('\n');
    }

    // ===== Speicher (§4.3, §9) =====
    const STORAGE_LOCATION = 'kiosk.location';
    const STORAGE_FORECAST = 'kiosk.lastForecast';

    function isValidLatLon(lat, lon) {
      return Number.isFinite(lat) && lat >= -90 && lat <= 90 && Number.isFinite(lon) && lon >= -180 && lon <= 180;
    }

    function getLocation() {
      try {
        const raw = localStorage.getItem(STORAGE_LOCATION);
        if (!raw) return null;
        const loc = JSON.parse(raw);
        if (isValidLatLon(loc.lat, loc.lon)) return loc;
      } catch (e) { /* kaputter Speicher: wie kein Standort behandeln */ }
      return null;
    }

    function setLocation(lat, lon) {
      const rounded = { lat: Math.round(lat * 100) / 100, lon: Math.round(lon * 100) / 100 };
      localStorage.setItem(STORAGE_LOCATION, JSON.stringify(rounded));
      return rounded;
    }

    function getLastForecast() {
      try {
        const raw = localStorage.getItem(STORAGE_FORECAST);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    function setLastForecast(data) {
      localStorage.setItem(STORAGE_FORECAST, JSON.stringify({ fetchedAt: Date.now(), data }));
    }

    // Weg A (§4.3): ?lat&lon werden bei jedem Start übernommen und aus der
    // Adressleiste entfernt, egal ob gültig.
    function adoptLocationFromUrl() {
      const params = new URLSearchParams(location.search);
      if (!params.has('lat') && !params.has('lon')) return;
      const lat = Number(params.get('lat'));
      const lon = Number(params.get('lon'));
      if (isValidLatLon(lat, lon)) setLocation(lat, lon);
      params.delete('lat');
      params.delete('lon');
      const rest = params.toString();
      history.replaceState(null, '', location.pathname + (rest ? `?${rest}` : '') + location.hash);
    }

    // ===== Open-Meteo (§5) =====
    function buildForecastUrl(lat, lon) {
      const params = new URLSearchParams({
        latitude: lat,
        longitude: lon,
        current: 'temperature_2m',
        hourly: 'temperature_2m,apparent_temperature,precipitation_probability,precipitation,'
          + 'snowfall,snow_depth,weather_code,uv_index,wind_gusts_10m,is_day',
        timezone: 'auto',
        timeformat: 'unixtime',
        past_hours: '6',
        forecast_days: '2',
      });
      return `https://api.open-meteo.com/v1/forecast?${params.toString()}`;
    }

    async function fetchForecast(lat, lon) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);
      try {
        const res = await fetch(buildForecastUrl(lat, lon), { signal: controller.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } finally {
        clearTimeout(timeout);
      }
    }

    // ===== Zustände & Aktualisierung (§9, §10) =====
    let fetchInFlight = false;
    let lastFetchAttempt = 0;
    let debugOverlayEnabled = false;
    let swRegistration = null;

    function renderFromStorage() {
      const stored = getLastForecast();
      const conditions = stored ? aggregate(stored.data, Date.now()) : null;

      if (!conditions) {
        renderBlank();
        setWxSlot(fetchInFlight ? 'loading' : 'icon', fetchInFlight ? null : 'i-sys-fehler');
        setHidden(els.sysIcon, true);
        if (debugOverlayEnabled) {
          setHidden(els.debugOverlay, false);
          els.debugOverlay.textContent = fetchInFlight ? 'lädt …' : 'Fehler: keine Daten';
        } else {
          setHidden(els.debugOverlay, true);
        }
        return;
      }

      const outfit = recommend(conditions, RULES, WX);
      renderOutfit(outfit, conditions);

      const ageMin = (Date.now() - stored.fetchedAt) / 60000;
      const stale = ageMin >= 180;
      setHidden(els.sysIcon, !stale);
      if (stale) setUse(els.sysIcon, 'i-sys-uhr');

      if (debugOverlayEnabled) renderDebugOverlay(outfit, conditions, Math.round(ageMin));
      else setHidden(els.debugOverlay, true);
    }

    function maybeRefresh(loc) {
      if (fetchInFlight) return;
      if (Date.now() - lastFetchAttempt < 60000) return; // Entprellen (§10)
      fetchInFlight = true;
      lastFetchAttempt = Date.now();
      fetchForecast(loc.lat, loc.lon)
        .then((data) => setLastForecast(data))
        .catch(() => { /* letzter Stand bzw. Fehlerzustand bleibt sichtbar */ })
        .finally(() => {
          fetchInFlight = false;
          renderFromStorage();
        });
    }

    function wake(loc) {
      if (swRegistration) swRegistration.update();
      maybeRefresh(loc);
      renderFromStorage();
    }

    function scheduleUpdates(loc) {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') wake(loc);
      });
      window.addEventListener('pageshow', () => wake(loc));
      setInterval(() => {
        if (document.visibilityState === 'visible') wake(loc);
      }, 30 * 60 * 1000);
    }

    function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      const controllerWasActive = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js')
        .then((reg) => { swRegistration = reg; })
        .catch(() => { /* App funktioniert auch ohne SW, nur ohne Offline-Cache */ });
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading || !controllerWasActive) { controllerWasActive = true; return; }
        reloading = true;
        location.reload();
      });
    }

    els.btnGeo.addEventListener('click', () => {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          setLocation(pos.coords.latitude, pos.coords.longitude);
          location.reload();
        },
        () => { /* abgelehnt: Setup-Screen bleibt */ },
      );
    });

    // ===== Debug- & Test-Modus (§13) =====
    const DEBUG_KEYS = ['temp', 'felt', 'tmin', 'rain', 'rainsum', 'wet', 'snow', 'depth', 'uv', 'gust', 'code', 'night', 'age'];

    function runDebugOrTest() {
      const params = new URLSearchParams(location.search);
      if (params.has('test')) { runTests(); return true; }
      if (!params.has('debug')) return false;

      if (!DEBUG_KEYS.some((k) => params.has(k))) {
        debugOverlayEnabled = true;
        return false; // Live-Daten + Overlay, normaler Ablauf greift weiter
      }

      const num = (k, fallback) => (params.has(k) ? Number(params.get(k)) : fallback);
      const tempP = params.has('temp') ? Number(params.get('temp')) : null;
      const feltP = params.has('felt') ? Number(params.get('felt')) : null;
      const tminP = params.has('tmin') ? Number(params.get('tmin')) : null;

      const conditions = {
        tempDisplay: tempP ?? feltP ?? 15,
        feltMin: feltP ?? tempP ?? 15,
        tempMin: tminP ?? tempP ?? 15,
        rainProbMax: num('rain', 0),
        rainSum: num('rainsum', 0),
        wetBefore: num('wet', 0),
        snowSum: num('snow', 0),
        snowDepth: num('depth', 0),
        uvMax: num('uv', 0),
        gustMax: num('gust', 0),
        code: num('code', 0),
        isDay: !params.has('night'),
      };
      const ageMin = num('age', 0);

      const outfit = recommend(conditions, RULES, WX);
      showScreen('kiosk');
      renderOutfit(outfit, conditions);
      const stale = ageMin >= 180;
      setHidden(els.sysIcon, !stale);
      if (stale) setUse(els.sysIcon, 'i-sys-uhr');
      renderDebugOverlay(outfit, conditions, ageMin);
      return true;
    }

    function runTests() {
      showScreen(null);
      setHidden(els.testOutput, false);

      const lines = [];
      let passCount = 0; let failCount = 0; let warnCount = 0;
      function assertEq(actual, expected, msg) {
        if (actual !== expected) {
          throw new Error(`${msg || ''} erwartet ${JSON.stringify(expected)}, war ${JSON.stringify(actual)}`);
        }
      }
      function assertTrue(v, msg) { if (!v) throw new Error(msg || 'erwartet true'); }
      function test(name, fn) {
        try { fn(); passCount++; lines.push(`PASS ${name}`); } catch (e) { failCount++; lines.push(`FAIL ${name} - ${e.message}`); }
      }
      function cond(overrides) {
        return Object.assign({
          tempDisplay: 15, feltMin: 15, tempMin: 15,
          rainProbMax: 0, rainSum: 0, wetBefore: 0,
          snowSum: 0, snowDepth: 0,
          uvMax: 0, gustMax: 0,
          code: 0, isDay: true,
        }, overrides);
      }

      RULES.bands.forEach((band) => {
        test(`Band ${band.id} liefert Basis-Outfit`, () => {
          const felt = band.min === -Infinity ? -50 : band.min;
          const o = recommend(cond({ feltMin: felt }), RULES, WX);
          assertEq(o.band, band.id);
          assertEq(o.top, `i-top-${band.top}`);
          assertEq(o.bottom, `i-bottom-${band.bottom}`);
          assertEq(o.shoes, `i-shoes-${band.shoes}`);
          assertEq(o.head, band.head ? `i-head-${band.head}` : null);
        });
      });

      test('Bandgrenze 24.9 -> warm', () => assertEq(recommend(cond({ feltMin: 24.9 }), RULES, WX).band, 'warm'));
      test('Bandgrenze 25.0 -> heiss', () => assertEq(recommend(cond({ feltMin: 25.0 }), RULES, WX).band, 'heiss'));
      test('Bandgrenze 19.9 -> mild', () => assertEq(recommend(cond({ feltMin: 19.9 }), RULES, WX).band, 'mild'));
      test('Bandgrenze -0.1 -> frost', () => assertEq(recommend(cond({ feltMin: -0.1 }), RULES, WX).band, 'frost'));
      test('Bandgrenze 0.0 -> eisig', () => assertEq(recommend(cond({ feltMin: 0.0 }), RULES, WX).band, 'eisig'));

      test('AC-6 felt=22 uv=3', () => {
        const o = recommend(cond({ feltMin: 22, uvMax: 3 }), RULES, WX);
        assertTrue(o.accessories.includes('i-acc-sonnencreme'));
        assertEq(o.head, 'i-head-sonnenhut');
        assertTrue(!o.accessories.includes('i-acc-sonnenbrille'));
      });
      test('AC-6 felt=22 uv=8', () => {
        const o = recommend(cond({ feltMin: 22, uvMax: 8 }), RULES, WX);
        assertTrue(o.accessories.includes('i-acc-sonnenbrille'));
      });
      test('AC-6 felt=3 uv=5', () => {
        const o = recommend(cond({ feltMin: 3, uvMax: 5 }), RULES, WX);
        assertEq(o.head, 'i-head-muetze');
        assertTrue(o.accessories.includes('i-acc-sonnencreme'));
      });

      test('AC-7 Regen', () => {
        const o = recommend(cond({ feltMin: 12, rainProbMax: 80, rainSum: 2 }), RULES, WX);
        assertEq(o.top, 'i-top-regenjacke');
        assertEq(o.shoes, 'i-shoes-gummistiefel');
      });
      test('AC-7 Regen+Schnee', () => {
        const o = recommend(cond({ feltMin: 12, rainProbMax: 80, rainSum: 2, snowSum: 1 }), RULES, WX);
        assertEq(o.top, 'i-top-schneeanzug');
        assertEq(o.shoes, 'i-shoes-winterstiefel');
      });
      test('AC-7 Regen bei Kaelte aendert nichts', () => {
        const o = recommend(cond({ feltMin: 3, rainProbMax: 80, rainSum: 2 }), RULES, WX);
        assertEq(o.top, 'i-top-winterjacke');
        assertEq(o.shoes, 'i-shoes-winterstiefel');
      });
      test('Regen nur bei UND-Bedingung', () => {
        const o = recommend(cond({ feltMin: 12, rainProbMax: 80, rainSum: 0.1 }), RULES, WX);
        assertEq(o.top, 'i-top-teddyjacke');
      });

      test('AC-16 felt=17 gust=55', () => {
        const o = recommend(cond({ feltMin: 17, gustMax: 55 }), RULES, WX);
        assertEq(o.top, 'i-top-kapuzenjacke');
        assertTrue(o.hints.includes('i-hint-wind'));
      });
      test('AC-16 felt=27 gust=55', () => {
        const o = recommend(cond({ feltMin: 27, gustMax: 55 }), RULES, WX);
        assertEq(o.top, 'i-top-tshirt');
        assertTrue(o.hints.includes('i-hint-wind'));
      });

      test('AC-17 felt=-1 tmin=0 wet=0.5', () => {
        const o = recommend(cond({ feltMin: -1, tempMin: 0, wetBefore: 0.5 }), RULES, WX);
        assertTrue(o.hints.includes('i-hint-glaette'));
      });
      test('AC-17 code=66', () => {
        const o = recommend(cond({ code: 66 }), RULES, WX);
        assertTrue(o.hints.includes('i-hint-glaette'));
      });

      test('Schnee schlaegt Wind', () => {
        const o = recommend(cond({ feltMin: 17, gustMax: 60, snowSum: 1 }), RULES, WX);
        assertEq(o.top, 'i-top-schneeanzug');
      });
      test('Regen schlaegt Wind', () => {
        const o = recommend(cond({ feltMin: 17, gustMax: 60, rainProbMax: 80, rainSum: 2 }), RULES, WX);
        assertEq(o.top, 'i-top-regenjacke');
      });

      test('AC-8 max 3 Zubehoer, max 2 Hinweise', () => {
        const o = recommend(cond({ feltMin: 3, uvMax: 8, gustMax: 60, code: 66, tempMin: -1 }), RULES, WX);
        assertTrue(o.accessories.length <= 3);
        assertTrue(o.hints.length <= 2);
      });

      test('AC-10 felt=30 -> 0', () => assertEq(recommend(cond({ feltMin: 30 }), RULES, WX).scalePos, 0));
      test('AC-10 felt=-5 -> 1', () => assertEq(recommend(cond({ feltMin: -5 }), RULES, WX).scalePos, 1));
      test('AC-10 felt=40 geklemmt -> 0', () => assertEq(recommend(cond({ feltMin: 40 }), RULES, WX).scalePos, 0));
      test('AC-10 felt=-20 geklemmt -> 1', () => assertEq(recommend(cond({ feltMin: -20 }), RULES, WX).scalePos, 1));

      function buildSample(startS, n) {
        const time = []; const temp = []; const felt = []; const prob = []; const precip = [];
        const snowfall = []; const snowDepth = []; const uv = []; const gust = []; const code = []; const isDay = [];
        for (let i = 0; i < n; i++) {
          time.push(startS + i * 3600); temp.push(10 + i); felt.push(8 + i);
          prob.push(i % 5 === 0 ? 60 : 10); precip.push(i % 5 === 0 ? 1 : 0);
          snowfall.push(0); snowDepth.push(0);
          uv.push(i % 24 < 12 ? 4 : 0); gust.push(10 + i);
          code.push(i % 7 === 0 ? 61 : 1); isDay.push(i % 24 < 12 ? 1 : 0);
        }
        return {
          current: { time: startS, temperature_2m: temp[0] },
          hourly: {
            time, temperature_2m: temp, apparent_temperature: felt, precipitation_probability: prob,
            precipitation: precip, snowfall, snow_depth: snowDepth, uv_index: uv,
            wind_gusts_10m: gust, weather_code: code, is_day: isDay,
          },
        };
      }

      test('aggregate() Index-Versatz', () => {
        const startS = 1000000000;
        const forecast = buildSample(startS, 30);
        const c = aggregate(forecast, (startS + 10 * 3600 + 100) * 1000);
        assertTrue(c !== null);
        assertEq(c.feltMin, 18);
        assertEq(c.tempMin, 20);
        assertEq(c.gustMax, 24);
      });
      test('aggregate() null bei Fenster ausserhalb der Daten', () => {
        const startS = 1000000000;
        const forecast = buildSample(startS, 10);
        const c = aggregate(forecast, (startS + 9 * 3600 + 100) * 1000);
        assertEq(c, null);
      });
      test('aggregate() null-Werte werden uebersprungen', () => {
        const startS = 1000000000;
        const forecast = buildSample(startS, 30);
        forecast.hourly.apparent_temperature[10] = null;
        const c = aggregate(forecast, (startS + 10 * 3600 + 100) * 1000);
        assertEq(c.feltMin, 19);
      });
      test('aggregate() alle Werte eines Summenfeldes null -> 0', () => {
        const startS = 1000000000;
        const forecast = buildSample(startS, 30);
        for (let i = 11; i <= 14; i++) forecast.hourly.precipitation[i] = null;
        const c = aggregate(forecast, (startS + 10 * 3600 + 100) * 1000);
        assertEq(c.rainSum, 0);
      });

      const usedIds = new Set();
      RULES.bands.forEach((b) => {
        if (b.head) usedIds.add(`i-head-${b.head}`);
        usedIds.add(`i-top-${b.top}`); usedIds.add(`i-bottom-${b.bottom}`); usedIds.add(`i-shoes-${b.shoes}`);
        b.acc.forEach((a) => usedIds.add(`i-acc-${a}`));
      });
      usedIds.add(`i-head-${RULES.sun.head}`);
      usedIds.add('i-acc-sonnencreme'); usedIds.add('i-acc-sonnenbrille');
      usedIds.add(`i-top-${RULES.wind.top}`); usedIds.add('i-hint-wind');
      usedIds.add(`i-top-${RULES.rain.top}`); usedIds.add(`i-shoes-${RULES.rain.shoes}`);
      usedIds.add(`i-top-${RULES.snow.top}`); usedIds.add(`i-shoes-${RULES.snow.shoes}`);
      usedIds.add('i-hint-glaette');
      WX.codeGroups.forEach((g) => { usedIds.add(`i-wx-${g.icon}`); usedIds.add(`i-wx-${g.iconNight}`); });
      usedIds.add('i-sys-uhr'); usedIds.add('i-sys-fehler');

      usedIds.forEach((id) => {
        test(`Icon vorhanden: ${id}`, () => {
          const symbol = document.getElementById(id);
          assertTrue(symbol && symbol.tagName.toLowerCase() === 'symbol', `Symbol #${id} fehlt`);
        });
        const symbol = document.getElementById(id);
        if (symbol && symbol.hasAttribute('data-placeholder')) {
          warnCount++;
          lines.push(`WARN Platzhalter aktiv: ${id}`);
        }
      });

      lines.push('');
      lines.push(`${passCount} PASS, ${failCount} FAIL, ${warnCount} WARN`);
      els.testOutput.textContent = lines.join('\n');
    }

    // ===== Start =====
    buildScaleDividers();
    registerServiceWorker();

    if (!runDebugOrTest()) {
      adoptLocationFromUrl();
      const loc = getLocation();
      if (loc) {
        showScreen('kiosk');
        wake(loc);
        scheduleUpdates(loc);
      } else {
        showScreen('setup');
      }
    }
  </script>
</body>
</html>
